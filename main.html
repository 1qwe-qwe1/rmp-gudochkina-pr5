<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoardGameHub | Магазин настольных игр</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="images/icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        
        body {
            background-color: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header styles */
        header {
            background-color: #ffffff;
            padding: 0;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .offers {
            background-color: #ffd700;
            padding: 12px 0;
            text-align: center;
        }
        
        .offers p {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            margin: 0;
        }
        
        .offers span {
            background-color: #1a1a1a;
            color: #ffd700;
            padding: 3px 10px;
            border-radius: 4px;
            margin: 0 5px;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        
        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #1a1a1a;
            display: flex;
            align-items: center;
        }
        
        .logo span {
            color: #ffd700;
            margin-right: 5px;
        }
        
        nav ul {
            display: flex;
            list-style: none;
        }
        
        nav ul li {
            margin-left: 30px;
        }
        
        nav ul li a {
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            position: relative;
            padding: 5px 0;
            transition: all 0.3s;
        }
        
        nav ul li a:hover {
            color: #ffd700;
        }
        
        nav ul li a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: #ffd700;
            transition: width 0.3s;
        }
        
        nav ul li a:hover::after {
            width: 100%;
        }
        
        .icon-links {
            display: flex;
            gap: 20px;
        }
        
        .icon-links a {
            color: #1a1a1a;
            font-size: 20px;
            transition: color 0.3s;
            position: relative;
        }
        
        .icon-links a:hover {
            color: #ffd700;
        }
        
        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: #ffd700;
            color: #1a1a1a;
            font-size: 12px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        /* Hero section with background image */
        .hero {
            position: relative;
            padding: 150px 0;
            margin-bottom: 60px;
            overflow: hidden;
            color: #1a1a1a;
        }
        
        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .hero-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .hero-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.6) 100%);
        }
        
        .hero-content {
            position: relative;
            z-index: 2;
        }
        
        .hero-text {
            max-width: 600px;
        }
        
        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #1a1a1a;
            line-height: 1.2;
        }
        
        .hero h1 span {
            color: #ffd700;
            position: relative;
        }
        
        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #4a4a4a;
        }
        
        .btn {
            display: inline-block;
            background-color: #ffd700;
            color: #1a1a1a;
            padding: 14px 32px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        
        .btn:hover {
            background-color: #f0c900;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }
        
        .btn-outline {
            background-color: transparent;
            color: #1a1a1a;
            border: 2px solid #1a1a1a;
            margin-left: 15px;
        }
        
        .btn-outline:hover {
            background-color: #1a1a1a;
            color: #ffffff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        /* Categories section */
        .section-title {
            text-align: center;
            margin-bottom: 50px;
            font-size: 32px;
            color: #1a1a1a;
            position: relative;
            padding-bottom: 15px;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background-color: #ffd700;
        }
        
        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 70px;
        }
        
        .category-card {
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
            text-align: center;
            padding: 30px 20px;
            border: 1px solid #f0f0f0;
        }
        
        .category-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }
        
        .category-icon {
            font-size: 40px;
            color: #ffd700;
            margin-bottom: 20px;
        }
        
        .category-content h3 {
            margin-bottom: 15px;
            color: #1a1a1a;
            font-size: 20px;
        }
        
        .category-content p {
            color: #7a7a7a;
            margin-bottom: 20px;
            font-size: 15px;
        }
        
        /* Featured products */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 70px;
        }
        
        .product-card {
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }
        
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 3px solid #ffd700;
        }
        
        .product-content {
            padding: 20px;
        }
        
        .product-content h3 {
            margin-bottom: 10px;
            color: #1a1a1a;
            font-size: 18px;
        }
        
        .product-content p {
            color: #7a7a7a;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .price {
            font-size: 20px;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .price span {
            background-color: #ffd700;
            color: #1a1a1a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        /* About section */
        .about {
            background-color: #f8f8f8;
            padding: 80px 0;
            margin-bottom: 70px;
        }
        
        .about-content {
            display: flex;
            align-items: center;
            gap: 50px;
        }
        
        .about-text {
            flex: 1;
        }
        
        .about-image {
            flex: 1;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
        
        .about-image img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* Blog preview */
        .blog-preview {
            margin-bottom: 70px;
        }
        
        .blog-posts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }
        
        .blog-post {
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .blog-post:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }
        
        .blog-post img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .blog-content {
            padding: 25px;
        }
        
        .blog-content h3 {
            margin-bottom: 15px;
            color: #1a1a1a;
            font-size: 20px;
        }
        
        .blog-content p {
            color: #7a7a7a;
            margin-bottom: 20px;
        }
        
        .blog-meta {
            display: flex;
            justify-content: space-between;
            color: #9a9a9a;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        /* Footer */
        footer {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 70px 0 30px;
        }
        
        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            margin-bottom: 40px;
        }
        
        .footer-section h3 {
            margin-bottom: 25px;
            font-size: 18px;
            color: #ffd700;
        }
        
        .footer-section p {
            color: #cccccc;
            margin-bottom: 20px;
            line-height: 1.8;
        }
        
        .footer-section ul {
            list-style: none;
        }
        
        .footer-section ul li {
            margin-bottom: 12px;
        }
        
        .footer-section ul li a {
            color: #cccccc;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .footer-section ul li a:hover {
            color: #ffd700;
        }
        
        .social-icons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background-color: #2a2a2a;
            color: #ffffff;
            border-radius: 50%;
            transition: all 0.3s;
        }
        
        .social-icons a:hover {
            background-color: #ffd700;
            color: #1a1a1a;
            transform: translateY(-3px);
        }
        
        .contact-info li {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            color: #cccccc;
        }
        
        .copyright {
            text-align: center;
            padding-top: 30px;
            border-top: 1px solid #333333;
            color: #9a9a9a;
            font-size: 14px;
        }
        
        /* Newsletter */
        .newsletter {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .newsletter input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 4px;
            background-color: #2a2a2a;
            color: #ffffff;
        }
        
        .newsletter button {
            background-color: #ffd700;
            color: #1a1a1a;
            border: none;
            border-radius: 4px;
            padding: 0 20px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        
        .newsletter button:hover {
            background-color: #f0c900;
        }
        
        /* Responsive design */
        @media (max-width: 992px) {
            .about-content {
                flex-direction: column;
            }
            
            .hero h1 {
                font-size: 36px;
            }
        }
        
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 20px;
            }
            
            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            nav ul li {
                margin: 0 10px 10px;
            }
            
            .hero {
                padding: 100px 0;
                text-align: center;
            }
            
            .hero h1 {
                font-size: 32px;
            }
            
            .btn-outline {
                margin-left: 0;
                margin-top: 15px;
                display: inline-block;
            }
        }
    </style>
</head>

        </div>
