<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина | BoardGameHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="images/icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        
        body {
            background-color: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header styles */
        header {
            background-color: #ffffff;
            padding: 0;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .offers {
            background-color: #ffd700;
            padding: 12px 0;
            text-align: center;
        }
        
        .offers p {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            margin: 0;
        }
        
        .offers span {
            background-color: #1a1a1a;
            color: #ffd700;
            padding: 3px 10px;
            border-radius: 4px;
            margin: 0 5px;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        
        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #1a1a1a;
            display: flex;
            align-items: center;
        }
        
        .logo span {
            color: #ffd700;
            margin-right: 5px;
        }
        
        nav ul {
            display: flex;
            list-style: none;
        }
        
        nav ul li {
            margin-left: 30px;
        }
        
        nav ul li a {
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            position: relative;
            padding: 5px 0;
            transition: all 0.3s;
        }
        
        nav ul li a:hover {
            color: #ffd700;
        }
        
        nav ul li a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: #ffd700;
            transition: width 0.3s;
        }
        
        nav ul li a:hover::after {
            width: 100%;
        }
        
        .icon-links {
            display: flex;
            gap: 20px;
        }
        
        .icon-links a {
            color: #1a1a1a;
            font-size: 20px;
            transition: color 0.3s;
            position: relative;
        }
        
        .icon-links a:hover {
            color: #ffd700;
        }
        
        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: #ffd700;
            color: #1a1a1a;
            font-size: 12px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        /* Page header */
        .page-header {
            background-color: #f8f8f8;
            padding: 40px 0;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .page-header h1 {
            font-size: 36px;
            color: #1a1a1a;
            margin-bottom: 15px;
        }
        
        .breadcrumb {
            display: flex;
            justify-content: center;
            list-style: none;
        }
        
        .breadcrumb li {
            margin: 0 10px;
            font-size: 14px;
            color: #7a7a7a;
        }
        
        .breadcrumb li a {
            color: #1a1a1a;
            text-decoration: none;
        }
        
        .breadcrumb li a:hover {
            color: #ffd700;
        }
        
        .breadcrumb li::after {
            content: '/';
            margin-left: 10px;
            color: #7a7a7a;
        }
        
        .breadcrumb li:last-child::after {
            content: '';
        }
        
        /* Cart layout */
        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            margin-bottom: 70px;
        }
        
        /* Cart items */
        .cart-items {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            padding: 25px;
        }
        
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .cart-header h2 {
            font-size: 24px;
            color: #1a1a1a;
        }
        
        .clear-cart {
            color: #7a7a7a;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .clear-cart:hover {
            color: #e74c3c;
        }
        
        .cart-item {
            display: grid;
            grid-template-columns: 100px 1fr auto;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .cart-item:last-child {
            border-bottom: none;
        }
        
        .cart-item-image {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .cart-item-details h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #1a1a1a;
        }
        
        .cart-item-details p {
            color: #7a7a7a;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .cart-item-price {
            font-weight: 600;
            color: #1a1a1a;
            font-size: 18px;
        }
        
        .cart-item-controls {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;
        }
        
        .quantity-controls {
            display: flex;
            align-items: center;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .quantity-btn {
            background: none;
            border: none;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            color: #7a7a7a;
        }
        
        .quantity-btn:hover {
            background-color: #f0f0f0;
            color: #1a1a1a;
        }
        
        .quantity-input {
            width: 40px;
            height: 36px;
            border: none;
            text-align: center;
            font-size: 16px;
            color: #1a1a1a;
            background-color: #ffffff;
        }
        
        .remove-item {
            color: #7a7a7a;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .remove-item:hover {
            color: #e74c3c;
        }
        
        /* Cart summary */
        .cart-summary {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            padding: 25px;
            height: fit-content;
        }
        
        .cart-summary h2 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .summary-row:last-child {
            margin-bottom: 0;
        }
        
        .summary-label {
            color: #7a7a7a;
        }
        
        .summary-value {
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .discount {
            color: #27ae60;
        }
        
        .total-row {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            font-size: 18px;
        }
        
        .total-row .summary-label {
            font-weight: 700;
            color: #1a1a1a;
        }
        
        .total-row .summary-value {
            font-weight: 700;
            color: #1a1a1a;
        }
        
        .promo-code {
            margin: 25px 0;
            padding: 20px 0;
            border-top: 1px solid #f0f0f0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .promo-code h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #1a1a1a;
        }
        
        .promo-form {
            display: flex;
            gap: 10px;
        }
        
        .promo-form input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .promo-form button {
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .promo-form button:hover {
            background-color: #333333;
        }
        
        .checkout-btn {
            display: block;
            width: 100%;
            background-color: #ffd700;
            color: #1a1a1a;
            border: none;
            padding: 16px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
        }
        
        .checkout-btn:hover {
            background-color: #f0c900;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }
        
        .continue-shopping {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #7a7a7a;
            text-decoration: none;
        }
        
        .continue-shopping:hover {
            color: #ffd700;
        }
        
        /* Empty cart */
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }
        
        .empty-cart i {
            font-size: 64px;
            color: #e0e0e0;
            margin-bottom: 20px;
        }
        
        .empty-cart h2 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 15px;
        }
        
        .empty-cart p {
            color: #7a7a7a;
            margin-bottom: 30px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* Recommended products */
        .recommended {
            margin-bottom: 70px;
        }
        
        .recommended h2 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }
        
        .product-card {
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }
        
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 3px solid #ffd700;
        }
        
        .product-content {
            padding: 20px;
        }
        
        .product-content h3 {
            margin-bottom: 10px;
            color: #1a1a1a;
            font-size: 18px;
        }
        
        .product-content p {
            color: #7a7a7a;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .price {
            font-size: 20px;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .price span {
            background-color: #ffd700;
            color: #1a1a1a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .product-card .btn {
            width: 100%;
            text-align: center;
        }
        
        /* Footer */
        footer {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 70px 0 30px;
        }
        
        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            margin-bottom: 40px;
        }
        
        .footer-section h3 {
            margin-bottom: 25px;
            font-size: 18px;
            color: #ffd700;
        }
        
        .footer-section p {
            color: #cccccc;
            margin-bottom: 20px;
            line-height: 1.8;
        }
        
        .footer-section ul {
            list-style: none;
        }
        
        .footer-section ul li {
            margin-bottom: 12px;
        }
        
        .footer-section ul li a {
            color: #cccccc;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .footer-section ul li a:hover {
            color: #ffd700;
        }
        
        .social-icons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background-color: #2a2a2a;
            color: #ffffff;
            border-radius: 50%;
            transition: all 0.3s;
        }
        
        .social-icons a:hover {
            background-color: #ffd700;
            color: #1a1a1a;
            transform: translateY(-3px);
        }
        
        .contact-info li {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            color: #cccccc;
        }
        
        .copyright {
            text-align: center;
            padding-top: 30px;
            border-top: 1px solid #333333;
            color: #9a9a9a;
            font-size: 14px;
        }
        
        .btn {
            display: inline-block;
            background-color: #ffd700;
            color: #1a1a1a;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn:hover {
            background-color: #f0c900;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }
        
        /* Responsive design */
        @media (max-width: 992px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }
            
            .cart-summary {
                order: -1;
            }
        }
        
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 20px;
            }
            
            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            nav ul li {
                margin: 0 10px 10px;
            }
            
            .cart-item {
                grid-template-columns: 1fr;
                text-align: center;
            }
            
            .cart-item-controls {
                align-items: center;
            }
            
            .products-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

        <div class="offers">
            <p>🚀 <span>СКИДКА 15%</span> на первую покупку при регистрации | 🎁 <span>БЕСПЛАТНАЯ ДОСТАВКА</span> от 3000 руб.</p>
        </div>
        <div class="container">

                    </ul>
                </nav>

                </div>
            </div>
        </div>

    <!-- Page header -->
    <div class="page-header">
